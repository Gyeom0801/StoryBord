<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMR AI 애니메이션 스토리보드 에디터</title>
    <!-- Tailwind CSS (디자인 프레임워크) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (아이콘) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 인쇄 시 스타일 최적화 (버튼 숨기기, 배경색 흰색 등) */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .cut-card { page-break-inside: avoid; border: 1px solid #ccc !important; box-shadow: none !important; background: white !important; color: black !important; margin-bottom: 20px; }
            textarea, input { color: black !important; border: 1px solid #eee !important; background: white !important; }
            .print-text-black { color: black !important; }
            /* 썸네일 테두리 숨기기 */
            .thumbnail-container { border: none !important; }
        }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        textarea { resize: vertical; min-height: 80px; }
    </style>
</head>
<body class="bg-[#121212] text-gray-200 font-sans p-6 pb-24 min-h-screen selection:bg-teal-500 selection:text-white">

    <!-- 상단 헤더 및 툴바 -->
    <header class="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-blue-500 flex items-center gap-2 print-text-black">
                <i class="fa-solid fa-headphones text-teal-400 print-text-black"></i>
                ASMR 스토리보드 에디터
            </h1>
            <p class="text-gray-400 mt-1 print-text-black">AI 애니메이션 제작을 위한 컷 분할 및 프롬프트 기획</p>
        </div>
        
        <div class="flex flex-wrap gap-3 no-print">
            <input type="file" id="fileImport" accept=".json" class="hidden" onchange="importData(event)">
            <button onclick="document.getElementById('fileImport').click()" class="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-sm font-medium rounded-lg transition-colors border border-gray-700" title="JSON 파일 불러오기">
                <i class="fa-solid fa-upload"></i> 불러오기
            </button>
            <button onclick="exportData()" class="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-sm font-medium rounded-lg transition-colors border border-gray-700" title="데이터 백업하기">
                <i class="fa-solid fa-file-code"></i> PC 저장
            </button>
            <button onclick="openGithubModal()" class="flex items-center gap-2 px-4 py-2 bg-[#2ea043] hover:bg-[#2c974b] text-white text-sm font-medium rounded-lg transition-colors shadow-sm" title="GitHub 연동 (클라우드 저장)">
                <i class="fa-brands fa-github text-lg"></i> GitHub 연동
            </button>
            <button onclick="window.print()" class="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-sm font-medium rounded-lg transition-colors border border-gray-700" title="PDF로 내보내기">
                <i class="fa-solid fa-print"></i> PDF 변환
            </button>
        </div>
    </header>

    <!-- 메인 캔버스 (스토리보드 컷들이 들어갈 자리) -->
    <div id="storyboard-container" class="max-w-6xl mx-auto space-y-6">
        <!-- 자바스크립트를 통해 컷들이 이곳에 생성됩니다. -->
    </div>

    <!-- 하단 플로팅 버튼 -->
    <div class="fixed bottom-8 left-0 right-0 flex justify-center pointer-events-none no-print z-40">
        <button onclick="addCut()" class="pointer-events-auto flex items-center gap-2 bg-teal-500 hover:bg-teal-400 text-black px-6 py-3 rounded-full font-bold shadow-[0_0_20px_rgba(20,184,166,0.3)] hover:shadow-[0_0_25px_rgba(20,184,166,0.5)] transition-all transform hover:-translate-y-1">
            <i class="fa-solid fa-plus text-lg"></i> 새로운 컷 추가하기
        </button>
    </div>

    <!-- GitHub 연동 모달창 -->
    <div id="githubModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 no-print backdrop-blur-sm">
        <div class="bg-[#1e1e1e] border border-gray-700 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
            <button onclick="closeGithubModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <div class="flex items-center gap-3 mb-6">
                <i class="fa-brands fa-github text-3xl text-white"></i>
                <h2 class="text-xl font-bold text-white">GitHub Gist 클라우드 동기화</h2>
            </div>
            
            <p class="text-sm text-gray-400 mb-6 leading-relaxed">
                GitHub 계정과 연동하여 스토리보드를 클라우드에 안전하게 저장하고 다른 기기에서 불러오세요. (비밀 Gist로 저장됩니다.)
            </p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">GitHub Personal Access Token</label>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-[#121212] border border-gray-700 rounded-md px-4 py-2 text-sm focus:border-teal-500 focus:outline-none text-white">
                    <p class="text-[11px] text-gray-500 mt-1">※ 'gist' 권한이 체크된 토큰이 필요합니다.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Gist ID (불러오거나 덮어쓸 때 필요)</label>
                    <input type="text" id="ghGistId" placeholder="처음 저장 시 자동으로 생성됩니다." class="w-full bg-[#121212] border border-gray-700 rounded-md px-4 py-2 text-sm focus:border-teal-500 focus:outline-none text-white font-mono">
                </div>

                <div id="syncMessage" class="hidden p-3 bg-gray-800/50 border border-gray-700 rounded-lg text-sm text-center text-teal-400 break-words"></div>

                <div class="flex gap-3 mt-6">
                    <button id="btnSaveGh" onclick="saveToGithub()" class="flex-1 flex items-center justify-center gap-2 bg-[#2ea043] hover:bg-[#2c974b] text-white py-2.5 rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 클라우드 저장
                    </button>
                    <button id="btnLoadGh" onclick="loadFromGithub()" class="flex-1 flex items-center justify-center gap-2 bg-gray-700 hover:bg-gray-600 text-white py-2.5 rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-cloud-arrow-down"></i> 데이터 불러오기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 스크립트 (기능 제어) -->
    <script>
        // UUID 생성 함수 (고유 ID)
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 초기 데이터 로드 (로컬 스토리지)
        let cuts = [];
        const savedData = localStorage.getItem('asmr-storyboard-data');
        if (savedData) {
            try { cuts = JSON.parse(savedData); } catch(e) {}
        }
        
        if (cuts.length === 0) {
            cuts.push({
                id: generateUUID(),
                dialogue: '',
                actionDescription: '',
                prompt: '',
                memo: '',
                image: null
            });
        }

        // 데이터 자동 저장 함수
        function saveData() {
            localStorage.setItem('asmr-storyboard-data', JSON.stringify(cuts));
        }

        // 화면 렌더링 함수
        function renderStoryboard() {
            const container = document.getElementById('storyboard-container');
            container.innerHTML = ''; // 기존 내용 지우기

            cuts.forEach((cut, index) => {
                const cutEl = document.createElement('div');
                cutEl.className = 'cut-card bg-[#1e1e1e] border border-gray-800 rounded-xl p-6 shadow-xl relative group flex flex-col md:flex-row gap-6';
                
                cutEl.innerHTML = `
                    <!-- 좌측: 제어 패널 & 썸네일 -->
                    <div class="w-full md:w-1/3 flex flex-col gap-4">
                        <div class="flex items-center justify-between no-print">
                            <span class="bg-teal-500/10 text-teal-400 px-3 py-1 rounded-md text-sm font-bold border border-teal-500/20">
                                Cut ${index + 1}
                            </span>
                            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="moveCut(${index}, 'up')" ${index === 0 ? 'disabled' : ''} class="p-1.5 text-gray-400 hover:text-white hover:bg-gray-700 rounded disabled:opacity-30 disabled:hover:bg-transparent cursor-pointer">
                                    <i class="fa-solid fa-arrow-up"></i>
                                </button>
                                <button onclick="moveCut(${index}, 'down')" ${index === cuts.length - 1 ? 'disabled' : ''} class="p-1.5 text-gray-400 hover:text-white hover:bg-gray-700 rounded disabled:opacity-30 disabled:hover:bg-transparent cursor-pointer">
                                    <i class="fa-solid fa-arrow-down"></i>
                                </button>
                                <button onclick="removeCut('${cut.id}')" class="p-1.5 text-red-400 hover:text-red-300 hover:bg-red-400/10 rounded cursor-pointer ml-2">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 썸네일 업로더 -->
                        <div class="thumbnail-container relative flex-1 min-h-[160px] bg-[#121212] border-2 border-dashed border-gray-700 hover:border-gray-500 rounded-lg overflow-hidden transition-colors group/img flex flex-col items-center justify-center">
                            ${cut.image ? `
                                <img src="${cut.image}" class="absolute inset-0 w-full h-full object-cover">
                                <label class="absolute inset-0 bg-black/50 opacity-0 group-hover/img:opacity-100 flex items-center justify-center cursor-pointer transition-opacity no-print">
                                    <span class="text-white text-sm font-medium"><i class="fa-regular fa-image"></i> 이미지 변경</span>
                                    <input type="file" accept="image/*" class="hidden" onchange="uploadImage('${cut.id}', event)">
                                </label>
                            ` : `
                                <label class="flex flex-col items-center justify-center w-full h-full cursor-pointer p-4 text-center">
                                    <i class="fa-regular fa-image text-3xl text-gray-500 mb-2"></i>
                                    <span class="text-sm text-gray-400">레퍼런스 이미지 업로드</span>
                                    <span class="text-xs text-gray-600 mt-1">(클릭하여 추가)</span>
                                    <input type="file" accept="image/*" class="hidden" onchange="uploadImage('${cut.id}', event)">
                                </label>
                            `}
                        </div>
                    </div>

                    <!-- 우측: 텍스트 정보 입력 -->
                    <div class="w-full md:w-2/3 flex flex-col gap-4">
                        <div class="flex-1">
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1 print-text-black">🗣 대사</label>
                            <textarea oninput="updateCut('${cut.id}', 'dialogue', this.value)" placeholder="대사를 입력하세요." class="w-full h-20 bg-[#121212] border border-gray-700 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-shadow resize-none text-gray-200 print-text-black placeholder-gray-600 leading-relaxed">${cut.dialogue || ''}</textarea>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1 print-text-black">🎬 상황 설명 (애니메이션, 모션 가이드)</label>
                            <textarea oninput="updateCut('${cut.id}', 'actionDescription', this.value)" placeholder="상황 설명 및 모션 가이드를 입력하세요." class="w-full h-20 bg-[#121212] border border-gray-700 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-shadow resize-none text-gray-200 print-text-black placeholder-gray-600 leading-relaxed">${cut.actionDescription || ''}</textarea>
                        </div>
                        <div class="flex-1">
                            <label class="flex items-center gap-1 text-xs font-semibold text-teal-400 uppercase tracking-wider mb-1 print-text-black"><i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> AI 이미지 생성 가이드</label>
                            <textarea oninput="updateCut('${cut.id}', 'prompt', this.value)" placeholder="AI 이미지 프롬프트를 작성하세요." class="w-full h-20 bg-teal-900/10 border border-teal-900/50 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-shadow resize-none text-teal-50 print-text-black placeholder-teal-800/50 leading-relaxed font-mono">${cut.prompt || ''}</textarea>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1 print-text-black">📝 기타 메모</label>
                            <textarea oninput="updateCut('${cut.id}', 'memo', this.value)" placeholder="기타 참고사항을 입력하세요." class="w-full h-16 bg-[#121212] border border-gray-700 rounded-md px-4 py-3 text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-shadow resize-none text-gray-200 print-text-black placeholder-gray-600 leading-relaxed">${cut.memo || ''}</textarea>
                        </div>
                    </div>
                `;
                container.appendChild(cutEl);
            });
            saveData();
        }

        // 컷 데이터 수정
        window.updateCut = function(id, field, value) {
            const cut = cuts.find(c => c.id === id);
            if(cut) {
                cut[field] = value;
                saveData(); // 화면 전체를 다시 그리지 않고 데이터만 저장
            }
        };

        // 컷 추가
        window.addCut = function() {
            cuts.push({ id: generateUUID(), dialogue: '', actionDescription: '', prompt: '', memo: '', image: null });
            renderStoryboard();
            // 화면 맨 아래로 스크롤
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        };

        // 컷 삭제
        window.removeCut = function(id) {
            if(confirm('이 컷을 삭제하시겠습니까?')) {
                cuts = cuts.filter(c => c.id !== id);
                renderStoryboard();
            }
        };

        // 컷 이동 (순서 변경)
        window.moveCut = function(index, direction) {
            if (direction === 'up' && index > 0) {
                [cuts[index - 1], cuts[index]] = [cuts[index], cuts[index - 1]];
            } else if (direction === 'down' && index < cuts.length - 1) {
                [cuts[index + 1], cuts[index]] = [cuts[index], cuts[index + 1]];
            }
            renderStoryboard();
        };

        // 이미지 업로드 (Base64)
        window.uploadImage = function(id, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const cut = cuts.find(c => c.id === id);
                    if(cut) cut.image = reader.result;
                    renderStoryboard();
                };
                reader.readAsDataURL(file);
            }
        };

        // PC 로컬 JSON 저장
        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cuts, null, 2));
            const dlNode = document.createElement('a');
            dlNode.setAttribute("href", dataStr);
            dlNode.setAttribute("download", "asmr_storyboard_backup.json");
            document.body.appendChild(dlNode);
            dlNode.click();
            dlNode.remove();
        };

        // PC 로컬 JSON 불러오기
        window.importData = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        // 이전 버전의 데이터를 불러올 때 'time' 필드가 있으면 삭제하고 'actionDescription'을 초기화
                        let loadedCuts = JSON.parse(e.target.result);
                        loadedCuts = loadedCuts.map(cut => {
                            if(cut.time !== undefined) delete cut.time;
                            if(cut.actionDescription === undefined) cut.actionDescription = '';
                            if(cut.memo === undefined) cut.memo = '';
                            return cut;
                        });
                        cuts = loadedCuts;
                        renderStoryboard();
                    } catch (err) {
                        alert("유효하지 않은 파일입니다.");
                    }
                };
                reader.readAsText(file);
            }
        };

        /* --- GitHub Gist 연동 관련 스크립트 --- */
        const ghModal = document.getElementById('githubModal');
        const tokenInput = document.getElementById('ghToken');
        const gistIdInput = document.getElementById('ghGistId');
        const msgBox = document.getElementById('syncMessage');

        // 모달 열 때 로컬스토리지에서 기존 정보 가져오기
        window.openGithubModal = function() {
            tokenInput.value = localStorage.getItem('asmr-github-token') || '';
            gistIdInput.value = localStorage.getItem('asmr-gist-id') || '';
            msgBox.classList.add('hidden');
            ghModal.classList.remove('hidden');
            ghModal.classList.add('flex');
        };

        window.closeGithubModal = function() {
            ghModal.classList.add('hidden');
            ghModal.classList.remove('flex');
        };

        function showMessage(msg, isError = false) {
            msgBox.textContent = msg;
            msgBox.classList.remove('hidden', 'text-teal-400', 'text-red-400');
            msgBox.classList.add(isError ? 'text-red-400' : 'text-teal-400');
        }

        window.saveToGithub = async function() {
            const token = tokenInput.value.trim();
            let gistId = gistIdInput.value.trim();
            if (!token) { showMessage('토큰을 입력해주세요.', true); return; }

            localStorage.setItem('asmr-github-token', token);
            showMessage('클라우드에 저장 중...');
            document.getElementById('btnSaveGh').disabled = true;

            try {
                const content = JSON.stringify(cuts, null, 2);
                const headers = { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
                const body = { description: 'ASMR Storyboard Backup', public: false, files: { 'asmr_storyboard.json': { content } } };

                let url = 'https://api.github.com/gists';
                let method = 'POST';
                if (gistId) {
                    url = `https://api.github.com/gists/${gistId}`;
                    method = 'PATCH';
                }

                const res = await fetch(url, { method, headers, body: JSON.stringify(body) });
                if (!res.ok) throw new Error('저장 실패 (토큰 권한 확인)');
                const data = await res.json();
                
                if (!gistId) {
                    gistIdInput.value = data.id;
                    localStorage.setItem('asmr-gist-id', data.id);
                }
                showMessage('✅ 깃허브에 성공적으로 저장되었습니다!');
                setTimeout(() => closeGithubModal(), 2000);
            } catch (e) {
                showMessage('❌ 오류: ' + e.message, true);
            } finally {
                document.getElementById('btnSaveGh').disabled = false;
            }
        };

        window.loadFromGithub = async function() {
            const token = tokenInput.value.trim();
            const gistId = gistIdInput.value.trim();
            if (!gistId) { showMessage('불러올 Gist ID가 없습니다.', true); return; }

            localStorage.setItem('asmr-github-token', token);
            localStorage.setItem('asmr-gist-id', gistId);
            showMessage('불러오는 중...');
            document.getElementById('btnLoadGh').disabled = true;

            try {
                const headers = token ? { 'Authorization': `token ${token}` } : {};
                const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
                if (!res.ok) throw new Error('불러오기 실패 (Gist ID 확인)');
                const data = await res.json();
                const fileContent = data.files['asmr_storyboard.json'].content;
                
                // 이전 버전의 데이터를 불러올 때 빈 항목 초기화
                let loadedCuts = JSON.parse(fileContent);
                loadedCuts = loadedCuts.map(cut => {
                    if(cut.time !== undefined) delete cut.time;
                    if(cut.actionDescription === undefined) cut.actionDescription = '';
                    if(cut.memo === undefined) cut.memo = '';
                    return cut;
                });
                
                cuts = loadedCuts;
                renderStoryboard();
                showMessage('✅ 성공적으로 불러왔습니다!');
                setTimeout(() => closeGithubModal(), 1500);
            } catch (e) {
                showMessage('❌ 오류: ' + e.message, true);
            } finally {
                document.getElementById('btnLoadGh').disabled = false;
            }
        };

        // 첫 페이지 로드 시 렌더링 실행
        renderStoryboard();
    </script>
</body>
</html>
